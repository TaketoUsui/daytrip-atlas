services:
  # Nginx Service (with SSL support)
  nginx:
    build: ./.docker/nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/var/www/public:ro
      - ./storage/app/public:/var/www/storage/app/public:ro
      - ./.docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./docker-volumes/certbot-www:/var/www/certbot
    depends_on:
      - php
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Certbot Service (for SSL certificate management)
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./docker-volumes/certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: always
    networks:
      - app-network

  # PHP Service (Laravel)
  php:
    build:
      context: .
      dockerfile: ./.docker/php/Dockerfile.production
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    environment:
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION}
      - CACHE_STORE=${CACHE_STORE}
      - SESSION_DRIVER=${SESSION_DRIVER}
      - HOME=/tmp
      - XDG_CONFIG_HOME=/tmp
      - PSYSH_CONFIG_DIR=/tmp/psysh
    restart: always
    networks:
      - app-network
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Laravel Queue Worker Service
  queue:
    build:
      context: .
      dockerfile: ./.docker/php/Dockerfile.production
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    command: sh -c "php /var/www/artisan queue:work --sleep=3 --tries=3 --timeout=300"
    environment:
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION}
      - HOME=/tmp
      - XDG_CONFIG_HOME=/tmp
      - PSYSH_CONFIG_DIR=/tmp/psysh
    restart: always
    networks:
      - app-network
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Laravel Scheduler Service
  scheduler:
    build:
      context: .
      dockerfile: ./.docker/php/Dockerfile.production
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    command: sh -c "while true; do php /var/www/artisan schedule:run --verbose --no-interaction && sleep 60; done"
    environment:
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_KEY=${APP_KEY}
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HOME=/tmp
      - XDG_CONFIG_HOME=/tmp
      - PSYSH_CONFIG_DIR=/tmp/psysh
    restart: always
    networks:
      - app-network
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # PostgreSQL + PostGIS Service
  db:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # パフォーマンス最適化
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=ja_JP.UTF-8"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker-volumes/db-backups:/backups
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    # セキュリティ: 外部からのアクセスを遮断 (ポートを公開しない)
    # ports:
    #   - "${DB_PORT}:5432"

# Networks
networks:
  app-network:
    driver: bridge

# Volumes
volumes:
  db-data:
    driver: local
  certbot-etc:
    driver: local
  certbot-var:
    driver: local
